async function probe(name, url, ms) {
  const t0 = performance.now();
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  let outcome = 'ok';
  try { await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ac.signal }); }
  catch (e) { outcome = (performance.now() - t0 >= ms - 120) ? 'TIMEOUT' : 'err'; }
  finally { clearTimeout(timer); }
  log(`t ${name} ${Math.round(performance.now() - t0)}ms ${outcome}`);
}

const ports1 = [22, 80, 443, 1337, 2375, 2376, 4243, 5000, 6443, 8000, 8080, 8888, 9090, 10250, 2379, 5432];

  for (const p of b) probe(`H:${p}`, `https://172.17.0.1:${p}/`, 1200);
  if (i < ports1.length) setTimeout(wave1, 1300);
}
